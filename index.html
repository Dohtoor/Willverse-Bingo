<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Commander Bingo</title>
<script src="js/theme-init.js"></script>
<style>
  :root {
    --bg: #fffdf6;
    --ink: #231f12;
    --muted: #6b6650;
    --card: #ffffff;
    --line: #efe7c6;
    --accent: #d9ab00;
    --accent-ink: #231f12;
    --mark: #ffd83d;
    --mark-ink: #231f12;
    --win: #231f12;
    --radius: 12px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1a1810;
    --ink: #f5efd9;
    --muted: #b3a982;
    --card: #26231a;
    --line: #3d3824;
    --accent: #ffc928;
    --accent-ink: #1a1810;
    --mark: #ffc928;
    --mark-ink: #1a1810;
    --win: #f5efd9;
    color-scheme: dark;
  }
  body { transition: background-color .2s ease, color .2s ease; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  header {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  h1 {
    margin: 0;
    font-size: clamp(11px, 2.6vw, 16px);
    letter-spacing: 0.14em;
    font-weight: 900;
    color: var(--muted);
  }
  h1 span { color: var(--accent); }
  h1 small {
    display: block;
    font-size: clamp(22px, 6.4vw, 40px);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink);
    line-height: 1.05;
    margin-bottom: 0.15em;
  }
  #progress { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .header-right { display: flex; align-items: center; gap: 10px; align-self: center; }
  #theme {
    width: 40px; height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    padding: 0;
    transition: border-color .15s, background-color .15s;
  }
  #theme:hover { border-color: var(--ink); }
  #theme:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #theme svg { width: 20px; height: 20px; }
  #theme .moon { display: none; }
  :root[data-theme="dark"] #theme .sun { display: none; }
  :root[data-theme="dark"] #theme .moon { display: block; }

  #board {
    width: 100%;
    max-width: 640px;
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: clamp(4px, 1.2vw, 8px);
  }
  .cell {
    position: relative;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    padding: clamp(3px, 1vw, 8px);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font: inherit;
    color: inherit;
    font-weight: 650;
    line-height: 1.15;
    cursor: pointer;
    overflow: hidden;
    overflow-wrap: break-word;
    user-select: none;
    transition: transform .12s ease, background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .cell:active { transform: scale(0.95); }
  .cell:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .cell .txt { display: block; width: 100%; min-width: 0; }
  .cell.marked {
    background: var(--mark);
    border-color: var(--mark);
    color: var(--mark-ink);
  }
  .cell.free {
    font-weight: 900;
  }
  .cell.win {
    border-color: var(--win);
    box-shadow: 0 0 0 3px var(--win) inset;
  }
  .cell.win.marked { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { filter: brightness(1.12); } }

  .controls {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
  }
  button.btn { display: inline-flex; align-items: center; gap: 8px; }
  button.btn svg { width: 18px; height: 18px; flex: none; }
  button.btn:disabled { opacity: .5; cursor: default; }
  button.btn {
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 2px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background-color .15s, color .15s, border-color .15s;
  }
  button.btn:hover { background: var(--ink); color: var(--bg); }
  button.btn.confirm { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  #banner {
    position: fixed;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%) scale(.6);
    opacity: 0;
    pointer-events: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 900;
    font-size: clamp(40px, 14vw, 96px);
    letter-spacing: 0.06em;
    padding: .15em .5em;
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
    transition: transform .35s cubic-bezier(.2,1.6,.4,1), opacity .25s;
    z-index: 10;
  }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-4deg); }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 9; }

  #error {
    display: none;
    max-width: 520px;
    background: var(--card);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 16px 20px;
    line-height: 1.5;
  }
  #error h2 { margin: 0 0 6px; font-size: 18px; color: var(--accent); }
  #error code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <header>
    <h1><small>The Commander</small>BIN<span>GO</span></h1>
    <div class="header-right">
      <div id="progress" aria-live="polite"></div>
      <button id="theme" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      </button>
    </div>
  </header>

  <main id="board" role="grid" aria-label="The Commander Bingo sheet"></main>

  <div class="controls">
    <button class="btn" id="save" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
      Save picture
    </button>
    <button class="btn" id="reroll" type="button">New sheet</button>
  </div>

  <div id="error" role="alert"></div>
  <div id="banner" aria-hidden="true">BINGO!</div>
  <canvas id="confetti"></canvas>

<script type="module" src="js/main.js"></script>
</body>
</html>
